spring.application.name=legacy-explainer

# Which CodeExplainer implementation to use: "ollama" or "stub"
app.explainer=ollama

# Local Ollama backend.
# qwen2.5-coder:1.5b is a good fit for CPU-only inference with 8 GB RAM.
app.ollama.base-url=http://localhost:11434
app.ollama.model=qwen2.5-coder:1.5b
app.ollama.timeout=3m

# LLM calls on CPU can be slow; keep the async request timeout generous.
spring.mvc.async.request-timeout=4m
